name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]

# Workflow-level: minimum (read). Job-level escalates only where required.
permissions:
  contents: read

jobs:
  release:
    name: Release & Publish
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: npm  # Link to GitHub Environment for OIDC
    permissions:
      contents: write       # push version bump commit + git tag + GitHub Release
      id-token: write       # npm OIDC trusted publishing (provenance)
      pull-requests: read   # read merged PR metadata for release notes
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest tag version
        id: latest_tag
        run: |
          # Get highest semver tag, default to v0.0.0 if none exists.
          # Uses --sort=-v:refname to pick the highest version independent of
          # commit-graph proximity; `git describe --tags --abbrev=0` returns
          # the nearest ancestor tag, which can be stale on branches with
          # scattered tag history (see #88).
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          LATEST_TAG="${LATEST_TAG:-v0.0.0}"
          VERSION="${LATEST_TAG#v}"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG (version: $VERSION)"

      - name: Determine version bump
        id: bump_type
        env:
          # Pass untrusted PR fields via env, never interpolate into shell.
          # See https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Check labels first
          if [[ "$PR_LABELS" == *"major"* ]] || [[ "$PR_LABELS" == *"breaking"* ]]; then
            echo "bump=major" >> $GITHUB_OUTPUT
            echo "Bump type: MAJOR (from label)"
          elif [[ "$PR_LABELS" == *"minor"* ]] || [[ "$PR_LABELS" == *"feature"* ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "Bump type: MINOR (from label)"
          elif [[ "$PR_LABELS" == *"patch"* ]] || [[ "$PR_LABELS" == *"fix"* ]]; then
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "Bump type: PATCH (from label)"
          # Fall back to conventional commit in PR title
          elif [[ "$PR_TITLE" =~ ^feat!:|^BREAKING ]]; then
            echo "bump=major" >> $GITHUB_OUTPUT
            echo "Bump type: MAJOR (breaking change)"
          elif [[ "$PR_TITLE" =~ ^feat:|^feat\( ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "Bump type: MINOR (feature)"
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "Bump type: PATCH (default)"
          fi

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.latest_tag.outputs.version }}"
          BUMP="${{ steps.bump_type.outputs.bump }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
          esac

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: v$NEW_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Reconcile version with package.json and npm registry
        id: final_version
        run: |
          CALC_VERSION="${{ steps.new_version.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          # Also check what's actually published on npm (the true source of truth)
          NPM_VERSION=$(npm view mcp-server-scf version 2>/dev/null || echo "0.0.0")
          echo "Tag-based calc: $CALC_VERSION | package.json: $PKG_VERSION | npm latest: $NPM_VERSION"

          # Use the highest of all three sources, then bump patch if it already exists on npm
          HIGHEST=$(npx --yes semver "$CALC_VERSION" "$PKG_VERSION" "$NPM_VERSION" | tail -1)

          if [ "$HIGHEST" = "$NPM_VERSION" ]; then
            # The highest version is already on npm — bump patch from npm version
            IFS='.' read -r M m p <<< "$NPM_VERSION"
            FINAL_VERSION="${M}.${m}.$((p + 1))"
            echo "npm already has $NPM_VERSION — bumping to $FINAL_VERSION"
          else
            FINAL_VERSION="$HIGHEST"
            echo "Using highest version: $FINAL_VERSION"
          fi

          echo "version=$FINAL_VERSION" >> $GITHUB_OUTPUT
          echo "Final version: v$FINAL_VERSION"

      - name: Update package.json and server.json versions
        run: |
          NEW_VERSION="${{ steps.final_version.outputs.version }}"
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

          # Keep server.json in lockstep with package.json so the MCP Registry
          # metadata tracks the npm release. Two fields need the bump: the
          # top-level .version and the npm package entry .packages[0].version.
          jq --arg v "$NEW_VERSION" \
            '.version = $v | (.packages[] | select(.registryType == "npm") | .version) |= $v' \
            server.json > server.json.tmp
          mv server.json.tmp server.json

          if git diff --quiet package.json package-lock.json server.json; then
            echo "No version changes needed"
          else
            git add package.json package-lock.json server.json
            git commit -m "chore(release): bump package.json + server.json to v${NEW_VERSION}"
            if git push origin main; then
              echo "Updated package.json + server.json to v${NEW_VERSION}"
            else
              echo "::warning::Could not push version update to main (branch protection). Update package.json + server.json manually or via next PR."
            fi
          fi

      - name: Create and push tag
        run: |
          NEW_VERSION="${{ steps.final_version.outputs.version }}"
          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::warning::Tag v${NEW_VERSION} already exists, skipping tag creation"
          else
            git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
            git push origin "v${NEW_VERSION}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npx eslint --version > /dev/null 2>&1 && npm run lint || echo "eslint not installed, skipping lint"

      - name: Type check
        run: npx tsc --noEmit

      - name: Check if version already on npm
        id: check_published
        run: |
          NEW_VERSION="${{ steps.final_version.outputs.version }}"
          if npm view "mcp-server-scf@${NEW_VERSION}" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::Version ${NEW_VERSION} already exists on npm — skipping publish"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Version ${NEW_VERSION} not on npm — will publish"
          fi

      - name: Publish to npm with provenance
        if: steps.check_published.outputs.skip != 'true'
        run: npm publish --provenance --access public

      - name: Build .mcpb Desktop Extension bundle
        id: build_mcpb
        run: |
          NEW_VERSION="${{ steps.final_version.outputs.version }}"
          npm run build:mcpb
          # Rename to include the version so the GitHub Release asset is self-describing.
          mv dist/mcp-server-scf.mcpb "dist/mcp-server-scf-${NEW_VERSION}.mcpb"
          echo "path=dist/mcp-server-scf-${NEW_VERSION}.mcpb" >> $GITHUB_OUTPUT
          ls -lh "dist/mcp-server-scf-${NEW_VERSION}.mcpb"

      - name: Generate release notes
        id: release_notes
        env:
          # Pass untrusted PR fields via env, never interpolate into shell.
          # See https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NEW_VERSION="${{ steps.final_version.outputs.version }}"
          PREVIOUS_TAG="${{ steps.latest_tag.outputs.tag }}"

          # Categorize commits since last release
          FEATURES=""
          FIXES=""
          DOCS=""
          CHORES=""
          OTHER=""

          if [ "$PREVIOUS_TAG" != "v0.0.0" ]; then
            while IFS= read -r line; do
              COMMIT_MSG="$line"
              if [[ "$COMMIT_MSG" =~ ^feat ]]; then
                FEATURES="${FEATURES}- ${COMMIT_MSG}"$'\n'
              elif [[ "$COMMIT_MSG" =~ ^fix ]]; then
                FIXES="${FIXES}- ${COMMIT_MSG}"$'\n'
              elif [[ "$COMMIT_MSG" =~ ^docs ]]; then
                DOCS="${DOCS}- ${COMMIT_MSG}"$'\n'
              elif [[ "$COMMIT_MSG" =~ ^chore ]] && [[ ! "$COMMIT_MSG" =~ ^chore\(release\) ]]; then
                CHORES="${CHORES}- ${COMMIT_MSG}"$'\n'
              elif [[ ! "$COMMIT_MSG" =~ ^Merge ]] && [[ ! "$COMMIT_MSG" =~ ^chore\(release\) ]]; then
                OTHER="${OTHER}- ${COMMIT_MSG}"$'\n'
              fi
            done < <(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"%s" --no-merges)
          fi

          # Build release notes
          cat > release_notes.md << 'RELEASE_EOF'
          ## What's Changed
          RELEASE_EOF
          echo "" >> release_notes.md
          echo "**PR #${PR_NUMBER}:** ${PR_TITLE}" >> release_notes.md

          if [ -n "$FEATURES" ]; then
            printf "\n### Features\n%s" "$FEATURES" >> release_notes.md
          fi

          if [ -n "$FIXES" ]; then
            printf "\n### Bug Fixes\n%s" "$FIXES" >> release_notes.md
          fi

          if [ -n "$DOCS" ]; then
            printf "\n### Documentation\n%s" "$DOCS" >> release_notes.md
          fi

          if [ -n "$CHORES" ]; then
            printf "\n### Maintenance\n%s" "$CHORES" >> release_notes.md
          fi

          if [ -n "$OTHER" ]; then
            printf "\n### Other Changes\n%s" "$OTHER" >> release_notes.md
          fi

          # Add footer
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "**Merged by:** @${PR_AUTHOR}" >> release_notes.md
          echo "**npm:** [mcp-server-scf@${NEW_VERSION}](https://www.npmjs.com/package/mcp-server-scf/v/${NEW_VERSION})" >> release_notes.md
          echo "**Claude Desktop Extension:** \`mcp-server-scf-${NEW_VERSION}.mcpb\` (see release assets below)" >> release_notes.md

          if [ "$PREVIOUS_TAG" != "v0.0.0" ]; then
            echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...v${NEW_VERSION}" >> release_notes.md
          fi

          echo "--- Release Notes ---"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ steps.final_version.outputs.version }}
          name: v${{ steps.final_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: ${{ steps.build_mcpb.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Created & Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Previous Version | ${{ steps.latest_tag.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| New Version | v${{ steps.final_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump Type | ${{ steps.bump_type.outputs.bump }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR | #${{ github.event.pull_request.number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm | [mcp-server-scf@${{ steps.final_version.outputs.version }}](https://www.npmjs.com/package/mcp-server-scf/v/${{ steps.final_version.outputs.version }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| .mcpb | [mcp-server-scf-${{ steps.final_version.outputs.version }}.mcpb](https://github.com/${{ github.repository }}/releases/download/v${{ steps.final_version.outputs.version }}/mcp-server-scf-${{ steps.final_version.outputs.version }}.mcpb) |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_published.outputs.skip }}" = "true" ]; then
            echo "| npm | Skipped (already published) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Provenance | Signed |" >> $GITHUB_STEP_SUMMARY
          fi
