name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]

# Workflow-level: minimum (read). Job-level escalates only where required.
permissions:
  contents: read

jobs:
  release:
    name: Release & Publish
    # Skip on our own version-bump PRs — otherwise each release triggers a
    # new release when its bump PR merges, looping forever.
    if: |
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    runs-on: ubuntu-latest
    environment: npm  # Link to GitHub Environment for OIDC
    permissions:
      contents: write        # push tag + GitHub Release + bump branch
      id-token: write        # npm OIDC trusted publishing (provenance)
      pull-requests: write   # open the version-bump PR that syncs main
      actions: write         # dispatch ci.yml against the bump branch (workflow_dispatch)
      attestations: write    # SLSA build provenance for the .mcpb release asset
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest tag version
        id: latest_tag
        run: |
          # Get highest semver tag, default to v0.0.0 if none exists.
          # Uses --sort=-v:refname to pick the highest version independent of
          # commit-graph proximity; `git describe --tags --abbrev=0` returns
          # the nearest ancestor tag, which can be stale on branches with
          # scattered tag history (see #88).
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          LATEST_TAG="${LATEST_TAG:-v0.0.0}"
          VERSION="${LATEST_TAG#v}"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG (version: $VERSION)"

      - name: Determine version bump
        id: bump_type
        env:
          # Pass untrusted PR fields via env, never interpolate into shell.
          # See https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Check labels first
          if [[ "$PR_LABELS" == *"major"* ]] || [[ "$PR_LABELS" == *"breaking"* ]]; then
            echo "bump=major" >> $GITHUB_OUTPUT
            echo "Bump type: MAJOR (from label)"
          elif [[ "$PR_LABELS" == *"minor"* ]] || [[ "$PR_LABELS" == *"feature"* ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "Bump type: MINOR (from label)"
          elif [[ "$PR_LABELS" == *"patch"* ]] || [[ "$PR_LABELS" == *"fix"* ]]; then
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "Bump type: PATCH (from label)"
          # Fall back to conventional commit in PR title
          elif [[ "$PR_TITLE" =~ ^feat!:|^BREAKING ]]; then
            echo "bump=major" >> $GITHUB_OUTPUT
            echo "Bump type: MAJOR (breaking change)"
          elif [[ "$PR_TITLE" =~ ^feat:|^feat\( ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "Bump type: MINOR (feature)"
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "Bump type: PATCH (default)"
          fi

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.latest_tag.outputs.version }}"
          BUMP="${{ steps.bump_type.outputs.bump }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
          esac

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: v$NEW_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Reconcile version with package.json and npm registry
        id: final_version
        run: |
          CALC_VERSION="${{ steps.new_version.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          # Also check what's actually published on npm (the true source of truth)
          NPM_VERSION=$(npm view mcp-server-scf version 2>/dev/null || echo "0.0.0")
          echo "Tag-based calc: $CALC_VERSION | package.json: $PKG_VERSION | npm latest: $NPM_VERSION"

          # Use the highest of all three sources, then bump patch if it already exists on npm.
          # `sort -V` (coreutils, present on the runner) does version-aware ordering with no
          # external dependency — avoids `npx --yes semver`, which fetches an unpinned package
          # at release time (supply-chain risk + OpenSSF Pinned-Dependencies ding).
          HIGHEST=$(printf '%s\n' "$CALC_VERSION" "$PKG_VERSION" "$NPM_VERSION" | sort -V | tail -1)

          if [ "$HIGHEST" = "$NPM_VERSION" ]; then
            # The highest version is already on npm — bump patch from npm version
            IFS='.' read -r M m p <<< "$NPM_VERSION"
            FINAL_VERSION="${M}.${m}.$((p + 1))"
            echo "npm already has $NPM_VERSION — bumping to $FINAL_VERSION"
          else
            FINAL_VERSION="$HIGHEST"
            echo "Using highest version: $FINAL_VERSION"
          fi

          echo "version=$FINAL_VERSION" >> $GITHUB_OUTPUT
          echo "Final version: v$FINAL_VERSION"

      - name: Update package.json and server.json versions
        run: |
          NEW_VERSION="${{ steps.final_version.outputs.version }}"
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

          # Keep server.json in lockstep with package.json so the MCP Registry
          # metadata tracks the npm release. Two fields need the bump: the
          # top-level .version and the npm package entry .packages[0].version.
          jq --arg v "$NEW_VERSION" \
            '.version = $v | (.packages[] | select(.registryType == "npm") | .version) |= $v' \
            server.json > server.json.tmp
          mv server.json.tmp server.json

          if git diff --quiet package.json package-lock.json server.json; then
            echo "No version changes needed"
          else
            git add package.json package-lock.json server.json
            git commit -m "chore(release): bump package.json + server.json to v${NEW_VERSION}"
            echo "Staged version bump commit locally — will open a PR after the release is recorded (direct push to main is blocked by branch protection)."
          fi

      - name: Create and push tag
        run: |
          NEW_VERSION="${{ steps.final_version.outputs.version }}"
          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::warning::Tag v${NEW_VERSION} already exists, skipping tag creation"
          else
            git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
            git push origin "v${NEW_VERSION}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npx eslint --version > /dev/null 2>&1 && npm run lint || echo "eslint not installed, skipping lint"

      - name: Type check
        run: npx tsc --noEmit

      - name: Check if version already on npm
        id: check_published
        run: |
          NEW_VERSION="${{ steps.final_version.outputs.version }}"
          if npm view "mcp-server-scf@${NEW_VERSION}" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::Version ${NEW_VERSION} already exists on npm — skipping publish"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Version ${NEW_VERSION} not on npm — will publish"
          fi

      - name: Publish to npm with provenance
        if: steps.check_published.outputs.skip != 'true'
        run: npm publish --provenance --access public

      - name: Publish to MCP Registry (DNS-auth)
        # Publishes server.json to registry.modelcontextprotocol.io so the
        # `app.scfcontrolsplatform/mcp-server-scf` entry stays in lockstep
        # with npm. Auth is DNS domain verification on scfcontrolsplatform.app
        # because GitHub OIDC only works for `io.github.*` namespaces.
        #
        # Non-fatal by design: if the secret isn't set (initial bootstrap),
        # or the publish call fails for any reason, we surface a warning but
        # don't fail the release — npm + tag + GH release have already
        # succeeded by this point.
        #
        # Prerequisites (one-time, Jeff-side — see PR body for full setup):
        #   1. `openssl genpkey -algorithm Ed25519 -out key.pem` locally
        #   2. Add DNS TXT record on scfcontrolsplatform.app apex:
        #        "v=MCPv1; k=ed25519; p=<base64_public_key>"
        #   3. `gh secret set MCP_REGISTRY_KEY --body "<hex_private_key>"`
        if: steps.check_published.outputs.skip != 'true'
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
          MCP_DOMAIN: scfcontrolsplatform.app
        run: |
          if [ -z "$MCP_REGISTRY_KEY" ]; then
            echo "::notice::MCP_REGISTRY_KEY secret not set — skipping MCP Registry publish. See PR #109 for one-time setup."
            exit 0
          fi

          # Download the latest mcp-publisher release binary.
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

          ./mcp-publisher login dns --domain "$MCP_DOMAIN" --private-key "$MCP_REGISTRY_KEY" \
            || { echo "::warning::mcp-publisher DNS login failed — check DNS TXT record propagation on $MCP_DOMAIN."; exit 0; }

          ./mcp-publisher publish \
            || { echo "::warning::mcp-publisher publish failed — MCP Registry may lag npm until manually resynced."; exit 0; }

          echo "Published server.json to MCP Registry."

      - name: Build .mcpb Desktop Extension bundle
        id: build_mcpb
        run: |
          NEW_VERSION="${{ steps.final_version.outputs.version }}"
          npm run build:mcpb
          # Rename to include the version so the GitHub Release asset is self-describing.
          mv dist/mcp-server-scf.mcpb "dist/mcp-server-scf-${NEW_VERSION}.mcpb"
          echo "path=dist/mcp-server-scf-${NEW_VERSION}.mcpb" >> $GITHUB_OUTPUT
          ls -lh "dist/mcp-server-scf-${NEW_VERSION}.mcpb"

      - name: Attest .mcpb build provenance
        # Generates a SLSA v1 build provenance attestation for the .mcpb
        # release asset and uploads it to Sigstore. Satisfies OpenSSF
        # Scorecard Signed-Releases (GitHub Release artifact channel; npm
        # tarball already gets provenance via `npm publish --provenance`).
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ steps.build_mcpb.outputs.path }}

      - name: Generate release notes
        id: release_notes
        env:
          # Pass untrusted PR fields via env, never interpolate into shell.
          # See https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NEW_VERSION="${{ steps.final_version.outputs.version }}"
          PREVIOUS_TAG="${{ steps.latest_tag.outputs.tag }}"

          # Categorize commits since last release
          FEATURES=""
          FIXES=""
          DOCS=""
          CHORES=""
          OTHER=""

          if [ "$PREVIOUS_TAG" != "v0.0.0" ]; then
            while IFS= read -r line; do
              COMMIT_MSG="$line"
              if [[ "$COMMIT_MSG" =~ ^feat ]]; then
                FEATURES="${FEATURES}- ${COMMIT_MSG}"$'\n'
              elif [[ "$COMMIT_MSG" =~ ^fix ]]; then
                FIXES="${FIXES}- ${COMMIT_MSG}"$'\n'
              elif [[ "$COMMIT_MSG" =~ ^docs ]]; then
                DOCS="${DOCS}- ${COMMIT_MSG}"$'\n'
              elif [[ "$COMMIT_MSG" =~ ^chore ]] && [[ ! "$COMMIT_MSG" =~ ^chore\(release\) ]]; then
                CHORES="${CHORES}- ${COMMIT_MSG}"$'\n'
              elif [[ ! "$COMMIT_MSG" =~ ^Merge ]] && [[ ! "$COMMIT_MSG" =~ ^chore\(release\) ]]; then
                OTHER="${OTHER}- ${COMMIT_MSG}"$'\n'
              fi
            done < <(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"%s" --no-merges)
          fi

          # Build release notes
          cat > release_notes.md << 'RELEASE_EOF'
          ## What's Changed
          RELEASE_EOF
          echo "" >> release_notes.md
          echo "**PR #${PR_NUMBER}:** ${PR_TITLE}" >> release_notes.md

          if [ -n "$FEATURES" ]; then
            printf "\n### Features\n%s" "$FEATURES" >> release_notes.md
          fi

          if [ -n "$FIXES" ]; then
            printf "\n### Bug Fixes\n%s" "$FIXES" >> release_notes.md
          fi

          if [ -n "$DOCS" ]; then
            printf "\n### Documentation\n%s" "$DOCS" >> release_notes.md
          fi

          if [ -n "$CHORES" ]; then
            printf "\n### Maintenance\n%s" "$CHORES" >> release_notes.md
          fi

          if [ -n "$OTHER" ]; then
            printf "\n### Other Changes\n%s" "$OTHER" >> release_notes.md
          fi

          # Add footer
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "**Merged by:** @${PR_AUTHOR}" >> release_notes.md
          echo "**npm:** [mcp-server-scf@${NEW_VERSION}](https://www.npmjs.com/package/mcp-server-scf/v/${NEW_VERSION})" >> release_notes.md
          echo "**Claude Desktop Extension:** \`mcp-server-scf-${NEW_VERSION}.mcpb\` (see release assets below)" >> release_notes.md

          if [ "$PREVIOUS_TAG" != "v0.0.0" ]; then
            echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...v${NEW_VERSION}" >> release_notes.md
          fi

          echo "--- Release Notes ---"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ steps.final_version.outputs.version }}
          name: v${{ steps.final_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: ${{ steps.build_mcpb.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open version-bump PR to sync main with the release
        # Runs after the release is durably recorded (tag + GH release + npm publish),
        # so a failure here never blocks or corrupts the release itself.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.final_version.outputs.version }}
        run: |
          # The bump commit has been sitting on local HEAD since the "Update
          # package.json and server.json versions" step — git tag already
          # annotated it, and it will travel to origin via this PR instead of
          # the blocked direct-to-main push.
          if ! git diff --quiet "origin/main" HEAD -- package.json package-lock.json server.json; then
            BUMP_BRANCH="chore/release-bump-v${NEW_VERSION}"

            if ! git push origin "HEAD:refs/heads/${BUMP_BRANCH}" 2>&1; then
              echo "::warning::Could not push ${BUMP_BRANCH} — main will stay stale until manually synced."
              exit 0
            fi

            gh pr create \
              --base main \
              --head "${BUMP_BRANCH}" \
              --title "chore(release): bump to v${NEW_VERSION}" \
              --body "Auto-opened by \`auto-release.yml\` after v${NEW_VERSION} was published to npm. Brings \`package.json\`, \`package-lock.json\`, and \`server.json\` on \`main\` in line with the release so \`release-health-check.yml\` stays green."

            # PRs created via GITHUB_TOKEN don't trigger workflows (GitHub
            # anti-loop rule), so the required status checks on `main`'s
            # branch protection (`build (20)`, `build (22)`, etc.) would
            # never fire for this PR on their own — leaving it stuck in
            # mergeable_state="blocked" forever. Explicitly dispatch ci.yml
            # against the bump branch to produce those check runs.
            gh workflow run ci.yml --ref "${BUMP_BRANCH}" 2>&1 \
              || echo "::warning::Could not dispatch ci.yml against ${BUMP_BRANCH} — the bump PR will need required checks satisfied another way."

            # Try to enable auto-merge. Requires the repo's "Allow auto-merge"
            # setting (Settings -> General) to be on; if it isn't, the fallback
            # leaves the PR waiting for a manual merge — not a failure mode
            # worth failing the release over.
            gh pr merge "${BUMP_BRANCH}" --auto --squash --delete-branch 2>&1 \
              || echo "::notice::Version-bump PR opened — merge manually if auto-merge isn't enabled in repo settings."
          else
            echo "No version bump needed — package.json + server.json already match main."
          fi

      - name: Summary
        run: |
          echo "## Release Created & Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Previous Version | ${{ steps.latest_tag.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| New Version | v${{ steps.final_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump Type | ${{ steps.bump_type.outputs.bump }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR | #${{ github.event.pull_request.number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm | [mcp-server-scf@${{ steps.final_version.outputs.version }}](https://www.npmjs.com/package/mcp-server-scf/v/${{ steps.final_version.outputs.version }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| .mcpb | [mcp-server-scf-${{ steps.final_version.outputs.version }}.mcpb](https://github.com/${{ github.repository }}/releases/download/v${{ steps.final_version.outputs.version }}/mcp-server-scf-${{ steps.final_version.outputs.version }}.mcpb) |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_published.outputs.skip }}" = "true" ]; then
            echo "| npm | Skipped (already published) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Provenance | Signed |" >> $GITHUB_STEP_SUMMARY
          fi
