name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check for type errors
        run: npx tsc --noEmit

      - name: Verify README tool count matches source
        run: |
          ACTUAL=$(grep -c "server.tool(" src/tools/*.ts | awk -F: '{sum += $2} END {print sum}')
          README_COUNT=$(grep -oE '\*\*[0-9]+ tools\*\*' README.md | head -n1 | grep -oE '[0-9]+')
          if [ "$ACTUAL" != "$README_COUNT" ]; then
            echo "::error::Tool count drift — README claims $README_COUNT tools, src/tools/ has $ACTUAL. Update README.md and the domain table."
            exit 1
          fi
          echo "Tool count OK: $ACTUAL"

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
