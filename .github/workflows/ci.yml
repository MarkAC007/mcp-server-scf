name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Explicit dispatch endpoint so auto-release.yml can kick this workflow
  # against bot-created bump branches (see #104/#105). PRs opened by
  # GITHUB_TOKEN don't trigger workflows on their own (GitHub anti-loop
  # rule), so the required status checks would never fire for those PRs
  # without an explicit dispatch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check for type errors
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Verify README tool count matches source
        run: |
          ACTUAL=$(grep -c "server.tool(" src/tools/*.ts | awk -F: '{sum += $2} END {print sum}')
          README_COUNT=$(grep -oE '\*\*[0-9]+ tools\*\*' README.md | head -n1 | grep -oE '[0-9]+')
          if [ "$ACTUAL" != "$README_COUNT" ]; then
            echo "::error::Tool count drift — README claims $README_COUNT tools, src/tools/ has $ACTUAL. Update README.md and the domain table."
            exit 1
          fi
          echo "Tool count OK: $ACTUAL"

      # Fails on any high/critical advisory unless it is listed with a reason
      # and an unexpired date in .github/audit-exceptions.json; an expired
      # entry for a still-reported advisory fails too. See scripts/audit-gate.mjs.
      - name: Audit dependencies
        run: node scripts/audit-gate.mjs
