version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    ignore:
      # typescript is capped at the bound typescript-eslint actually declares:
      # 8.70.0 peers typescript ">=4.8.4 <6.1.0", so 6.1.0 breaks `npm ci` exactly
      # as 7.0.2 did in #226 — and 6.0.3 -> 6.1.0 is a *minor*, which a
      # semver-major ignore would have waved straight through into the
      # dev-dependencies group. Pin to the peer bound, not to an update type.
      # Drop this entry once `npm view typescript-eslint peerDependencies.typescript`
      # admits the newer range, then let Dependabot re-open the bump.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      # vitest and its coverage plugin pin each other exactly (peer vitest@X.Y.Z),
      # so a major of one can never install alone (#225/#228 both failed npm ci).
      # Group them across every update type so they always move in one PR.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      # CodeQL steps must move together: mixed init/autobuild/analyze versions
      # fail with "Loaded a configuration file for version X, but running version Y".
      codeql-action:
        patterns:
          - "github/codeql-action*"
